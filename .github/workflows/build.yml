name: Build ALONE_X_CHEAT EXE

on:
 push:
 branches: [ main ]
 workflow_dispatch:

jobs:
 build:
 runs-on: windows-latest

 steps:
 - name: Checkout code
 uses: actions/checkout@v4

 - name: Setup Python
 uses: actions/setup-python@v5
 with:
 python-version: '3.12'

 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install -r requirements.txt

 - name: Build EXE with PyInstaller
 run: |
 python -m PyInstaller --noconfirm --clean --onefile --console --noupx --name ALONE_X_CHEAT --hidden-import=win32crypt --hidden-import=Crypto --hidden-import=Crypto.Cipher --hidden-import=Crypto.Cipher.AES grabber.py

 - name: Upload EXE artifact
 uses: actions/upload-artifact@v4
 with:
 name: ALONE_X_CHEAT_EXE
 path: dist/ALONE_X_CHEAT.exe
 retention-days: 90
